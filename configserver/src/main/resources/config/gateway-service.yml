eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
    non-secure-port-enabled: true
    non-secure-port: ${server.port}

spring:
  application:
    name: GATEWAY-SERVICE
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8181/realms/focus-analytics/protocol/openid-connect/certs
          issuer-uri: http://localhost:8181/realms/focus-analytics
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: focus-session-service
              uri: lb://FOCUS-SESSION-SERVICE
              predicates:
                - Path=/api/focus-sessions/**

            - id: insight-service
              uri: lb://INSIGHT-SERVICE
              predicates:
                - Path=/api/insights/**

server:
  port: 8080

