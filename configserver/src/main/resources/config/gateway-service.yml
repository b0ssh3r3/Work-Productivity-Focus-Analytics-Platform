eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8181/realms/focus-analytics/protocol/openid-connect/certs
          issuer-uri: http://localhost:8181/realms/focus-analytics
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: activity-service
              uri: lb://ACTIVITY-SERVICE
              predicates:
                - Path=/api/focus-sessions/**

            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/insights/**

server:
  port: 8080

