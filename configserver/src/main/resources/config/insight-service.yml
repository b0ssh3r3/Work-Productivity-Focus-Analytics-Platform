spring:
  application:
    name: INSIGHT-SERVICE
  data:
    mongodb:
      uri: mongodb://localhost:27017/insightanalytics
      database: insightanalytics
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: focus-session-processor-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.focusanalytics.insightservice.model.FocusSession
        spring.json.trusted.packages: "*"

gemini:
  api:
    url: ${GEMINI_URL:http://localhost:9999}
    key: ${GEMINI_KEY:dummy-key}

kafka:
  topic:
    name: focus-session-events

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
    non-secure-port-enabled: true
    non-secure-port: ${server.port}

server:
  port: 8083
